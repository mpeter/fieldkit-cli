id: fieldkit-codex
display_name: fieldkit-cli Codex worker
description: Host subscription access token for a bounded coding worker
category: inference
inference_capable: true
credentials:
  - name: access_token
    env_vars: [CODEX_AUTH_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [access_token]
endpoints:
  - host: chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/codex
