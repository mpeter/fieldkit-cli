# tach.toml — Architecture boundary enforcement for fieldkit
# Run: uv run tach check
# Docs: https://docs.gauge.sh/
#
# Single package: src/fieldkit/
#
# Domain modules (no click imports allowed):
#   fieldkit.errors   — no deps (pure exception hierarchy; imported by all domains)
#   fieldkit.config   — no fieldkit deps (pure foundation)
#   fieldkit.llm      — depends on fieldkit.config, fieldkit.errors
#   fieldkit.tasks    — depends on fieldkit.util; callers supply configuration
#   fieldkit.sf       — depends on fieldkit.config, fieldkit.errors, fieldkit.pursuit, fieldkit.util
#   fieldkit.gmail    — depends on fieldkit.config, fieldkit.errors (no ingest dep — D2d resolved)
#   fieldkit.pursuit  — depends on fieldkit.config, fieldkit.errors, fieldkit.util
#   fieldkit.pipeline — owns pursuit review collection, rendering, and local quota collection
#   fieldkit.brief    — owns both brief modes and their orchestration
#   fieldkit.watch    — depends on fieldkit.config
#   fieldkit.skill    — depends on fieldkit.config
#   fieldkit.ingest   — depends on config, llm, errors, google_oauth, pursuit, tasks, util
#   fieldkit.enrich   — depends on fieldkit.config, fieldkit.gmail
#   fieldkit.shadowbot — depends on fieldkit.config, fieldkit.errors
#
# Top-level fieldkit module (cli_exit, dotenv_compat):
#   depends on config, shared errors, and the pure sf.errors leaf for typed diagnostics.
#   The SF initializer is docstring-only; no Salesforce client or transport is imported.
#
# CLI adapters: fieldkit.commands.* — depends on domain modules
#
source_roots = ["src", "."]
# The ingest/Gmail circular dependency is avoided: GmailCandidate lives in
# fieldkit.gmail.discover;
# fieldkit.ingest.sources consumes _CandidateProtocol (structural typing, no import).

exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "build",
]

[[modules]]
path = "fieldkit"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.sf.errors"]

[[modules]]
path = "fieldkit.errors"
depends_on = []

[[modules]]
path = "fieldkit.sf.types"
depends_on = []

[[modules]]
path = "fieldkit.sf._transport"
depends_on = ["fieldkit.config"]

[[modules]]
path = "fieldkit.sf._responses"
depends_on = ["fieldkit.config", "fieldkit.sf.errors", "fieldkit.sf.types"]

[[modules]]
path = "fieldkit.sf.errors"
depends_on = ["fieldkit.errors"]

[[modules]]
path = "fieldkit.sqlite_read"
depends_on = ["fieldkit.errors", "fieldkit.util"]  # Typed snapshot outcomes and bounded process execution.

[[modules]]
path = "fieldkit.sqlite_publication"
depends_on = ["fieldkit._sqlite_publication_storage"]

[[modules]]
path = "fieldkit._sqlite_publication_storage"
depends_on = ["fieldkit.util"]

[[modules]]
path = "fieldkit.google_oauth"
depends_on = ["fieldkit.errors"]  # Shared OAuth refresh and private token persistence.

[[modules]]
path = "fieldkit.driver"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.util", "fieldkit.llm"]  # The driver stores run status atomically and resolves the LLM log database.

[[modules]]
path = "fieldkit.autonomy"
depends_on = ["fieldkit.driver"]  # Reads the persisted driver outcome contract without invoking execution.

[[modules]]
path = "fieldkit.provenance"
depends_on = ["fieldkit.pursuit"]  # Derived-document markers use pursuit.io's safe YAML renderer.

[[modules]]
path = "fieldkit.circuit_breaker"
depends_on = []  # Zero-dependency resilience utility; importable by any domain.

[[modules]]
path = "fieldkit.util"
depends_on = ["fieldkit.errors"]  # Atomic output guards use the zero-dependency error hierarchy.

[[modules]]
path = "fieldkit.config"
depends_on = ["fieldkit.errors", "fieldkit.util"]  # Uses the shared atomic YAML writer.

[[modules]]
path = "fieldkit.llm"
depends_on = ["fieldkit.config", "fieldkit.errors"]  # Configured Vertex location takes priority over environment variables.

[[modules]]
path = "fieldkit.tasks"
depends_on = ["fieldkit.util"]  # Configuration is supplied by callers; persistence uses foundation utilities.

[[modules]]
path = "fieldkit.sf"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.sf.errors", "fieldkit.sf.types", "fieldkit.sf._transport", "fieldkit.sf._responses", "fieldkit.pursuit", "fieldkit.util"]  # Salesforce frontmatter updates reuse canonical pursuit I/O and workspace confinement.

[[modules]]
path = "fieldkit.gmail"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.google_oauth", "fieldkit.sqlite_read", "fieldkit.sqlite_publication"]

[[modules]]
path = "fieldkit.pursuit"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.util"]

[[modules]]
path = "fieldkit.pipeline"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.gmail", "fieldkit.llm", "fieldkit.pursuit", "fieldkit.sf", "fieldkit.util"]

[[modules]]
path = "fieldkit.brief"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.gmail", "fieldkit.llm", "fieldkit.provenance", "fieldkit.pursuit", "fieldkit.util", "fieldkit.watch", "fieldkit.pipeline"]

[[modules]]
path = "fieldkit.watch"
depends_on = ["fieldkit.config", "fieldkit.util", "fieldkit.pursuit", "fieldkit.circuit_breaker", "fieldkit.ingest", "fieldkit.errors", "fieldkit.companion"]  # Morning brief reads the companion outbox through its public API.

[[modules]]
path = "fieldkit.skill"
depends_on = ["fieldkit.config", "fieldkit.llm", "fieldkit.errors"]

[[modules]]
path = "fieldkit.ingest"
depends_on = ["fieldkit.config", "fieldkit.llm", "fieldkit.errors", "fieldkit.google_oauth", "fieldkit.pursuit", "fieldkit.tasks", "fieldkit.util", "fieldkit.sqlite_read"]  # Completed-meeting writebacks share foundation persistence utilities.

[[modules]]
path = "fieldkit.enrich"
depends_on = ["fieldkit.config", "fieldkit.gmail"]

[[modules]]
path = "fieldkit.contact"
depends_on = ["fieldkit.config", "fieldkit.gmail", "fieldkit.enrich", "fieldkit.pursuit", "fieldkit.provenance", "fieldkit.sqlite_read", "fieldkit.sqlite_publication", "fieldkit.errors"]  # Contact indexing publishes canonical generations and propagates typed snapshot failures.

[[modules]]
path = "fieldkit.meeting"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.pursuit", "fieldkit.ingest"]  # Pursuit Workbook logic uses the ingest domain's Google Docs and Drive clients.

[[modules]]
path = "fieldkit.shadowbot"
depends_on = ["fieldkit.config", "fieldkit.errors"]

[[modules]]
path = "fieldkit.health"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.util"]  # Health owns a gate table and runner; filing uses an injected protocol.

[[modules]]
path = "fieldkit.issue"
depends_on = ["fieldkit.config", "fieldkit.errors"]  # Canonical issue identity, transitions, and GitHub adapter.

[[modules]]
path = "fieldkit.companion"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.util"]  # companion loop: feed reads workspace files, cursor via locked_json_update

[[modules]]
path = "fieldkit.gtask"
depends_on = ["fieldkit.config", "fieldkit.errors"]  # Shared Google Tasks domain.

[[modules]]
path = "fieldkit.web"
depends_on = ["fieldkit.config", "fieldkit.errors", "fieldkit.llm", "fieldkit.companion", "fieldkit.gtask", "fieldkit.autonomy"]  # Dashboard reads shared domains and local execution observations.

[[modules]]
path = "fieldkit.commands"
depends_on = [
    "fieldkit.autonomy",
    "fieldkit",
    "fieldkit.circuit_breaker",
    "fieldkit.config",
    "fieldkit.errors",
    "fieldkit.llm",
    "fieldkit.sf",
    "fieldkit.sf.errors",
    "fieldkit.sf.types",
    "fieldkit.gmail",
    "fieldkit.google_oauth",
    "fieldkit.pursuit",
    "fieldkit.pipeline",
    "fieldkit.brief",
    "fieldkit.ingest",
    "fieldkit.watch",
    "fieldkit.skill",
    "fieldkit.tasks",
    "fieldkit.enrich",
    "fieldkit.shadowbot",
    "fieldkit.util",  # Shared non-empty post-write guard.
    "fieldkit.provenance",  # Derived-document marker on emitted summaries.
    "fieldkit.driver",  # fieldkit.commands.driver delegates to fieldkit.driver domain
    "fieldkit.web",  # fieldkit.commands.web delegates to fieldkit.web domain
    "fieldkit.companion",  # fieldkit.commands.companion delegates to fieldkit.companion domain
    "fieldkit.health",  # fieldkit.commands.health delegates to the health domain.
    "fieldkit.meeting",  # fieldkit.commands.meeting delegates to the meeting domain.
    "fieldkit.contact",  # fieldkit.commands.contact delegates to the contact domain.
    "fieldkit.gtask",  # fieldkit.commands.gtask delegates to the Google Tasks domain.
    "fieldkit.issue",  # fieldkit.commands.issue delegates to the canonical issue domain.
    "fieldkit.sqlite_read",  # Read adapters consume verified private SQLite snapshots.
]

[[modules]]
path = "hooks"
depends_on = ["fieldkit", "fieldkit.config", "fieldkit.enrich", "fieldkit.errors"]
