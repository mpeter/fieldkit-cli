version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python:uv"
    ignore:
      # The build backend decides the core metadata version, which the pinned
      # PyPI publisher must accept. Bump it deliberately with that check; see
      # tests/test_distribution_metadata.py.
      - dependency-name: "hatchling"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions:
        patterns:
          - "*"
