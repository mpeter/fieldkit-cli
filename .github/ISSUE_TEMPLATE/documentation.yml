name: Documentation problem
description: Report missing, incorrect, or confusing public documentation
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Link the page or name the command whose documentation needs attention.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the action the documentation should have enabled.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was missing, incorrect, or confusing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional wording, example, or structure that would have helped.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: Any examples are generic and contain no sensitive or organization-private information.
          required: true
