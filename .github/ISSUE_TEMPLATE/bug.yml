name: Bug report
description: Report reproducible unexpected fieldkit behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve fieldkit. For usage questions, choose the support form. For a
        suspected vulnerability, stop and use the private route in SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observable result and include the exact error after redaction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the result you expected from the documented behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: List the smallest commands and generic setup that reproduce the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: fieldkit_version
    attributes:
      label: fieldkit version
      description: Paste the output of `fieldkit --version`.
      placeholder: fieldkit 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version, and installation profile.
      placeholder: Fedora 43, Python 3.11, fieldkit-cli[google]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted logs, screenshots, or links only when they help reproduce the issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, cookies, customer data, email content, private hosts, and personal paths.
          required: true
  - type: checkboxes
    id: existing
    attributes:
      label: Existing reports
      options:
        - label: I searched open and closed issues for this behavior.
          required: true
