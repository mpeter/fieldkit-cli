name: Full enforcement

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-full:
    name: Full quality enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-python: true
          prune-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Install the pinned public-tree secret scanner
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          extraction="$RUNNER_TEMP/gitleaks-extract"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --connect-timeout 10 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum --check
          mkdir "$extraction"
          tar --extract --file "$archive" --directory "$extraction" gitleaks
          install -m 0755 "$extraction/gitleaks" "$binary"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify the pinned public-tree secret scanner
        run: |
          test "$(command -v gitleaks)" = "$RUNNER_TEMP/gitleaks"
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"
      - name: Run complete quality gate
        run: make quality-full
      - name: Summarize full-repository coverage
        if: always()
        run: >-
          uv run python scripts/ci_evidence.py coverage
          --input coverage.json
          --output reports/coverage-summary.json
          --step-summary "$GITHUB_STEP_SUMMARY"
          --source-revision "$GITHUB_SHA"
          --scope full-repository
          --command 'make quality-full'
          --minimum-percent 80
      - name: Upload full-repository coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-full-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            coverage.json
            reports/coverage-summary.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload AgentReady report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: agentready-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .agentready/report-latest.html
          retention-days: 30
          if-no-files-found: error
