name: Cutover verification

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  verify-root:
    if: github.event.before == '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install the locked optional profiles required by full enforcement
        run: uv sync --all-extras --locked
      - name: Install the pinned public-tree secret scanner
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          extraction="$RUNNER_TEMP/gitleaks-extract"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --connect-timeout 10 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum --check
          mkdir "$extraction"
          tar --extract --file "$archive" --directory "$extraction" gitleaks
          install -m 0755 "$extraction/gitleaks" "$binary"
          "$binary" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prove the initial public commit is a root commit
        run: test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA"
      - name: Run the frozen full repository gate
        run: >-
          uv run python scripts/quality_gate.py run --tier full --workers 4
          --receipt reports/quality-full.json
      - name: Upload the full quality-controller receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutover-quality-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: reports/quality-full.json
          retention-days: 30
          if-no-files-found: error
