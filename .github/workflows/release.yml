name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a retained candidate or publish it to TestPyPI
        required: true
        type: choice
        options:
          - dry-run
          - testpypi
  push:
    tags:
      - "v*.*.*"

permissions: {}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_plan.outputs.tag }}
      release_version: ${{ steps.release_plan.outputs.version }}
      approval_run: ${{ steps.approval_metadata.outputs.run }}
      approval_manifest_sha256: ${{ steps.approval_metadata.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the authoritative release identity
        id: release_plan
        run: |
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"
      - name: Confirm the release ref matches the authoritative release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          else
            test "$GITHUB_REF_NAME" = "${{ steps.release_plan.outputs.tag }}"
            tag_reference="$(timeout 60s gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
            tag_object_sha="$(jq -r '.object.sha' <<< "$tag_reference")"
            [[ "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
            tag_object="$(timeout 60s gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
            jq -e --arg tag "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" \
              '.tag == $tag and .object.sha == $sha and .verification.verified == true' \
              <<< "$tag_object" > /dev/null
          fi
      - name: Read required approval metadata from a production tag
        id: approval_metadata
        if: github.event_name == 'push'
        run: |
          annotation="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")"
          run="$(sed -n 's/^Release-approval-run: \([1-9][0-9]*\)$/\1/p' <<< "$annotation")"
          digest="$(sed -n 's/^Release-approval-manifest-sha256: \([0-9a-f]\{64\}\)$/\1/p' <<< "$annotation")"
          [[ "$run" =~ ^[1-9][0-9]*$ ]]
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          test "$(wc -l <<< "$run")" -eq 1
          test "$(wc -l <<< "$digest")" -eq 1
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Retain the evidence renderer for partial-run reporting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            scripts/release_promotion_evidence.py
            scripts/release_bundle.py
            scripts/release_consumer.py
            scripts/release_wheelhouse.py
            pyproject.toml
          if-no-files-found: error
          retention-days: 90

  build:
    # A dispatch builds one candidate; a production tag may only acquire the
    # signed tag's protected approval artifact. It never rebuilds source.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && needs.approval.result == 'skipped')
    needs: [context, approval]
    outputs:
      bundle_manifest_sha256: ${{ steps.bundle_manifest.outputs.sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Acquire the exact approval artifact named by the signed tag
        if: github.event_name == 'push'
        env:
          APPROVAL_RUN: ${{ needs.context.outputs.approval_run }}
          APPROVAL_MANIFEST_SHA256: ${{ needs.context.outputs.approval_manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$APPROVAL_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          approval_run="$(timeout 60s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVAL_RUN")"
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .head_sha == $sha and (.path | startswith(".github/workflows/release-approval.yml@")) and (.run_attempt | type == "number")' \
            <<< "$approval_run" > /dev/null
          approval_attempt="$(jq -r '.run_attempt' <<< "$approval_run")"
          expected_name="release-approval-input-${APPROVAL_RUN}-${approval_attempt}-${GITHUB_SHA}"
          artifacts="$(timeout 60s gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$APPROVAL_RUN/artifacts?per_page=100")"
          artifact_id="$(jq -r --arg name "$expected_name" '[.[].artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else empty end' <<< "$artifacts")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          timeout 60s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > approved-input.zip
          python scripts/release_approval_archive.py --archive approved-input.zip --destination approved-artifact
          test "$(sha256sum approved-artifact/approval-input/approval-manifest.json | cut -d' ' -f1)" = "$APPROVAL_MANIFEST_SHA256"
          uv run python scripts/release_approval_input.py --input approved-artifact/approval-input --repo-root .
          mkdir candidate
          cp approved-artifact/approval-input/public-candidate/report.json candidate/report.json
          cp -R approved-artifact/approval-input/public-candidate/bundle candidate/bundle
      - name: Install the pinned export secret scanner
        if: github.event_name == 'workflow_dispatch'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          scanner_root="$RUNNER_TEMP/gitleaks-extract"
          scanner_binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --connect-timeout 10 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum --check
          mkdir "$scanner_root"
          tar --extract --file "$archive" --directory "$scanner_root" gitleaks
          install -m 0755 "$scanner_root/gitleaks" "$scanner_binary"
          "$scanner_binary" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build the one retained public candidate
        if: github.event_name == 'workflow_dispatch'
        run: |
          uv run python scripts/check_public_candidate.py \
            --repo . \
            --revision "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --planned-tag "${{ needs.context.outputs.release_tag }}" \
            --output-dir candidate \
            --json > candidate-report.json
      - name: Retain the sealed candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            candidate/
            scripts/check_release_consumer.py
            scripts/release_bundle.py
            scripts/release_consumer.py
            scripts/release_promotion_evidence.py
            scripts/release_wheelhouse.py
            pyproject.toml
          if-no-files-found: error
          retention-days: 90
      - name: Record the sealed bundle manifest digest
        id: bundle_manifest
        run: echo "sha256=$(sha256sum candidate/bundle/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  approval:
    if: github.event_name == 'push'
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-approval
    permissions:
      contents: read
    steps:
      - name: Require the protected production approval boundary
        run: test "$GITHUB_EVENT_NAME" = "push"

  validate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Revalidate the exact downloaded bundle
        run: |
          uv run python scripts/release_bundle.py \
            --candidate-report candidate/report.json \
            candidate/bundle \
            --json

  attest:
    if: github.event_name == 'push' || inputs.mode == 'testpypi'
    needs: [build, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .
      - name: Verify sealed distributions without project code
        env:
          EXPECTED_BUNDLE_MANIFEST_SHA256: ${{ needs.build.outputs.bundle_manifest_sha256 }}
        run: |
          test "$(sha256sum candidate/bundle/SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED_BUNDLE_MANIFEST_SHA256"
          (cd candidate/bundle && sha256sum --strict --check SHA256SUMS)
          mkdir release-dist
          cp candidate/bundle/*.whl candidate/bundle/*.tar.gz release-dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-path: release-dist

  publish_testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'testpypi'
    needs: [build, validate, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .
      - name: Verify sealed distributions without project code
        env:
          EXPECTED_BUNDLE_MANIFEST_SHA256: ${{ needs.build.outputs.bundle_manifest_sha256 }}
        run: |
          test "$(sha256sum candidate/bundle/SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED_BUNDLE_MANIFEST_SHA256"
          (cd candidate/bundle && sha256sum --strict --check SHA256SUMS)
          mkdir release-dist
          cp candidate/bundle/*.whl candidate/bundle/*.tar.gz release-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-dist
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    if: github.event_name == 'push'
    needs: [build, validate, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .
      - name: Verify sealed distributions without project code
        env:
          EXPECTED_BUNDLE_MANIFEST_SHA256: ${{ needs.build.outputs.bundle_manifest_sha256 }}
        run: |
          test "$(sha256sum candidate/bundle/SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED_BUNDLE_MANIFEST_SHA256"
          (cd candidate/bundle && sha256sum --strict --check SHA256SUMS)
          mkdir release-dist
          cp candidate/bundle/*.whl candidate/bundle/*.tar.gz release-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-dist

  consumer_pypi:
    if: github.event_name == 'push'
    needs: [context, build, validate, publish_pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-inputs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify the published candidate as a fresh consumer
        env:
          PYTHONPATH: release-inputs
        run: |
          python -m scripts.check_release_consumer \
            --bundle release-inputs/candidate/bundle \
            --candidate-report release-inputs/candidate/report.json \
            --index-endpoint "https://pypi.org/pypi/fieldkit-cli/${{ needs.context.outputs.release_version }}/json" \
            --download-host files.pythonhosted.org \
            --download-dir consumer-downloads \
            --verify-downloads \
            --verify-install \
            --max-attempts 6 \
            --poll-interval-seconds 10 \
            --output consumer-evidence.json \
            --allow-live-index
      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: consumer-evidence.json
          if-no-files-found: error
          retention-days: 90

  github_release:
    if: github.event_name == 'push'
    needs: [build, validate, attest, publish_pypi, consumer_pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .
      - name: Verify sealed distributions without project code
        env:
          EXPECTED_BUNDLE_MANIFEST_SHA256: ${{ needs.build.outputs.bundle_manifest_sha256 }}
        run: |
          test "$(sha256sum candidate/bundle/SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED_BUNDLE_MANIFEST_SHA256"
          (cd candidate/bundle && sha256sum --strict --check SHA256SUMS)
          mkdir release-dist
          cp candidate/bundle/*.whl candidate/bundle/*.tar.gz release-dist/
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-dist/* --generate-notes

  promotion_evidence:
    if: always() && github.event_name == 'push'
    needs: [build, validate, attest, publish_pypi, consumer_pypi, github_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download the retained evidence renderer
        id: evidence_tools
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: candidate
        continue-on-error: true
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-inputs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Record promotion outcomes with the verified candidate
        if: steps.evidence_tools.outcome == 'success' && steps.candidate.outcome == 'success'
        env:
          PYTHONPATH: release-inputs
          BUILD: ${{ needs.build.result }}
          VALIDATE: ${{ needs.validate.result }}
          ATTEST: ${{ needs.attest.result }}
          PUBLISH_PYPI: ${{ needs.publish_pypi.result }}
          CONSUMER_PYPI: ${{ needs.consumer_pypi.result }}
          GITHUB_RELEASE: ${{ needs.github_release.result }}
        run: |
          python -m scripts.release_promotion_evidence \
            --source-revision "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --bundle release-inputs/candidate/bundle \
            --candidate-report release-inputs/candidate/report.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --outcome "build=$BUILD" \
            --outcome "validate=$VALIDATE" \
            --outcome "attest=$ATTEST" \
            --outcome "publish_pypi=$PUBLISH_PYPI" \
            --outcome "consumer_pypi=$CONSUMER_PYPI" \
            --outcome "github_release=$GITHUB_RELEASE" \
            --output promotion-evidence.json
      - name: Record a schema-valid missing-candidate outcome
        if: steps.evidence_tools.outcome == 'success' && steps.candidate.outcome != 'success'
        env:
          PYTHONPATH: release-inputs
          BUILD: ${{ needs.build.result }}
          VALIDATE: ${{ needs.validate.result }}
          ATTEST: ${{ needs.attest.result }}
          PUBLISH_PYPI: ${{ needs.publish_pypi.result }}
          CONSUMER_PYPI: ${{ needs.consumer_pypi.result }}
          GITHUB_RELEASE: ${{ needs.github_release.result }}
        run: |
          python -m scripts.release_promotion_evidence \
            --source-revision "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --outcome "build=$BUILD" \
            --outcome "validate=$VALIDATE" \
            --outcome "attest=$ATTEST" \
            --outcome "publish_pypi=$PUBLISH_PYPI" \
            --outcome "consumer_pypi=$CONSUMER_PYPI" \
            --outcome "github_release=$GITHUB_RELEASE" \
            --candidate-unavailable \
            --output promotion-evidence.json
      - name: Record an unavailable-evidence-tool outcome
        if: steps.evidence_tools.outcome != 'success'
        env:
          BUILD: ${{ needs.build.result }}
          VALIDATE: ${{ needs.validate.result }}
          ATTEST: ${{ needs.attest.result }}
          PUBLISH_PYPI: ${{ needs.publish_pypi.result }}
          CONSUMER_PYPI: ${{ needs.consumer_pypi.result }}
          GITHUB_RELEASE: ${{ needs.github_release.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcomes = {
              "build": os.environ["BUILD"], "validate": os.environ["VALIDATE"],
              "attest": os.environ["ATTEST"], "publish_pypi": os.environ["PUBLISH_PYPI"],
              "consumer_pypi": os.environ["CONSUMER_PYPI"], "github_release": os.environ["GITHUB_RELEASE"],
          }
          boundary_actions = {
              "build": "scripts/check_public_candidate.py", "validate": "scripts/release_bundle.py",
              "attest": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
              "publish_pypi": "pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0",
              "consumer_pypi": "scripts/check_release_consumer.py", "github_release": "gh release create",
          }
          Path("promotion-evidence.json").write_text(
              json.dumps({"schema_version": 1, "kind": "release-promotion", "status": "failed",
                  "source_repository": os.environ["GITHUB_REPOSITORY"], "source_ref": os.environ["GITHUB_REF"],
                  "source_revision": os.environ["GITHUB_SHA"], "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "outcomes": outcomes,
                  "boundary_actions": boundary_actions, "candidate": None},
                  indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Retain promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: promotion-evidence.json
          if-no-files-found: error
          retention-days: 90
