# fieldkit command-line application
[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "fieldkit-cli"
version = "1.0.0"
description = "A programmable productivity CLI for account engineering workflows"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
maintainers = [{ name = "fieldkit maintainers" }]
requires-python = ">=3.11"
keywords = ["automation", "cli", "productivity", "salesforce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.25",
    "jsonschema>=4.23,<5",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "questionary>=2.0",
    "rich>=13.0.0",
    "ruamel-yaml>=0.18.16,<0.20",
    "tenacity>=8.2",
]

[project.urls]
Documentation = "https://github.com/mpeter/fieldkit-cli/tree/main/docs"
Issues = "https://github.com/mpeter/fieldkit-cli/issues"
Repository = "https://github.com/mpeter/fieldkit-cli"

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.131.0",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]
llm = [
    "google-cloud-aiplatform>=1.38",
    "litellm>=1.95,<2",
    "openai>=1.30,<4",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
chrome-auth = [
    "cryptography>=50.0.0",
    "secretstorage>=3.0",
]
all = [
    "cryptography>=50.0.0",
    "fastapi>=0.111",
    "google-api-python-client>=2.131.0",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-aiplatform>=1.38",
    "litellm>=1.95,<2",
    "openai>=1.30,<4",
    "secretstorage>=3.0",
    "uvicorn>=0.30",
]

[project.scripts]
fieldkit = "fieldkit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldkit"]
exclude = ["src/fieldkit/**/AGENTS.md"]
artifacts = [
    "src/fieldkit/_data/*.json",
    "src/fieldkit/_data/*.md",
    "src/fieldkit/ingest/*.sql",
    "src/fieldkit/gmail/*.sql",
    "src/fieldkit/skills/**/*",
    "src/fieldkit/web/static/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/src/fieldkit",
]
exclude = ["src/fieldkit/**/AGENTS.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = ["internal", ".venv", "__pycache__", ".git", "build"]
addopts = ["-n", "auto", "--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests as integration tests (use seeded_db fixture)",
    "unit: fast in-process tests with no external dependencies",
    "characterization: locks observable behavior of existing code; may use in-memory databases",
    "slow: subprocess or IO-heavy tests excluded from the default fast suite",
    "network: opts out of the conftest outbound-network guard; genuinely needs egress",
]

[tool.pyright]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ruamel", "ruamel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["googleapiclient", "googleapiclient.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["websockets", "websockets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["questionary", "questionary.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["secretstorage", "secretstorage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptography", "cryptography.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
force-exclude = true
exclude = ["*.sql", "Makefile", "build/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "C4", "SIM", "PLW", "RUF", "W", "PTH", "TID"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.ruff.lint.flake8-tidy-imports]
# Tombstone list for deleted backward-compat shims (R25).
# Every entry here is a shim path that was deleted during spec 003.
# Adding an entry blocks any future import of that path at CI time.
# Do NOT remove entries — the list is append-only.
banned-module-level-imports = [
    # Tombstone list: old flat shim paths deleted during spec 003 (aeos.* namespace).
    # aeos.* package deleted in modernize-project-structure-v2; use fieldkit.* instead.
    "aeos.action_item_classifier",
    "aeos.drive_docs",
    "aeos.gmail_discover",
    "aeos.ingest_db",
    "aeos.io",
    "aeos.llm_log",
    "aeos.models",
    "aeos.name_resolver",
    "aeos.router",
    "aeos.sf_direct",
    "aeos.skill_template",
    "aeos.stale_prose_check",
    "aeos.tasks_writer",
    "aeos.transcribe",
    "aeos.transcript_pipeline",
    "aeos.watcher_dedup",
    "aeos.watcher_logging",
    "aeos.watcher_status",
    # Tombstone the entire aeos namespace — any aeos.* import is dead code.
    "aeos.config",
    "aeos.llm",
    "aeos.sf",
    "aeos.gmail",
    "aeos.pursuit",
    "aeos.ingest",
    "aeos.tasks",
    "aeos.watch",
    "aeos.skill",
    "aeos.cli_exit",
    "aeos.run_context",
    "aeos.dotenv_compat",
    # Tombstone list: old CLI package paths (pre-src/ layout).
    "fieldkit.sf_pipeline",
    "fieldkit.gmail_cache",
    "fieldkit.morning_brief",
    "fieldkit.pipeline_review",
    "fieldkit.data_sync",
    # Command-layer MCP shim deleted after watch-domain migration.
    "fieldkit.commands.watch.morning_brief_mcp",
    # Command-layer collection shim deleted after watch-domain migration.
    "fieldkit.commands.watch.morning_brief_collect",
    # Tombstone list: shadowbot-rewrite deleted modules.
    "fieldkit.shadowbot.browser",
    "fieldkit.shadowbot._conversations",
    # Tombstone prevents accidental resurrection of the deleted run-context module.
    "fieldkit.run_context",
]

[dependency-groups]
release-build = [
    "hatchling==1.32.0",
]
dev = [
    "gaze-py>=0.9.3",
    "mkdocs>=1.6,<2",
    "mutmut>=3.6.0,<4.0.0",
    "mypy>=2.3.0",
    "openpyxl>=3.1",
    "pip>=26.2,<27",
    "pydantic>=2.13.4,<3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "ruff>=0.15",
    "tach>=0.35",
]

[tool.coverage.run]
omit = [
    # enrich — live API pipelines (Backstory, Gmail, Tavily); schema.py IS tested via tests/
    "src/fieldkit/commands/enrich/enrich_contacts.py",
    "src/fieldkit/enrich/web_enrich.py",
    # Internal diagnostic scripts — not part of the test suite
    "internal/verify_output.py",
]

[tool.coverage.report]
# 80% standalone (no fieldkit-data); reaches 87% with data-dependent tests
fail_under = 80

[tool.mutmut]
source_paths = [
    "src/fieldkit/pursuit/io.py",
    "src/fieldkit/cli_exit.py",
    "src/fieldkit/tasks/classifier.py",
]
also_copy = ["src/fieldkit/"]
pytest_add_cli_args_test_selection = [
    "tests/test_pursuit_io.py",
    "tests/test_cli_exit.py",
    "tests/test_action_item_classifier.py",
]
pytest_add_cli_args = ["-n", "0", "-p", "no:tach", "-p", "no:cacheprovider"]
timeout_constant = 15.0
