# gaze-py configuration for fieldkit
# Docs: https://github.com/unbound-force/gaze-py
#
# Which command reads what (gaze-py 0.8.1):
#   classification.thresholds -> `gazepy quality` (+ `gazepy report`)
#   scoring                   -> `gazepy report` / GazeCRAP only. NOT the `crap`
#                                gate: `gazepy crap`'s --crap-threshold CLI default
#                                (15.0) unconditionally overrides scoring.crap_threshold.
#   doc_scan                  -> `gazepy report` only (see `make gaze-report`).
# The `crap` regression gate (make quality / CI) is driven by .gaze/baseline.json
# and --max-crapload, not by this file.

classification:
  thresholds:
    # Effect-classification confidence [0-100] for the "contractual" label, read by
    # `gazepy quality`. INDEPENDENT of the --min-contract-coverage gate and of the
    # test->function pairing confidence (see docs/subtleties/gaze_subtleties.md).
    # gaze-py default is 80; 75 deliberately widens the contractual set (larger
    # coverage denominator).
    contractual: 75
    # Maximum confidence score (exclusive) for "incidental" label.
    incidental: 50

  doc_scan:
    exclude:
      # Defaults
      - "vendor/**"
      - "node_modules/**"
      - ".git/**"
      - "testdata/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      # Project-specific: exclude virtualenv, OpenCode node deps, cache dirs
      - ".venv/**"
      - ".opencode/node_modules/**"
      - ".agentready/**"
      - "reports/**"
      - ".pytest_cache/**"
      - "build/**"

scoring:
  # NOTE: `gazepy crap` ignores these (its --crap-threshold CLI default 15.0 wins);
  # they apply to `gazepy report`'s CRAP/GazeCRAP computation only. Kept at 15.0 to
  # match the crap gate's effective threshold so `make gaze-report` reports consistently.
  crap_threshold: 15.0

  # GazeCRAP threshold (O1 — enforcement deferred until contract-coverage ships).
  gaze_crap_threshold: 15.0
