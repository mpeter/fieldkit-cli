# Gaze configuration for fieldkit. Makefile owns the executable gate commands.
# Classification and documentation scanning inform scored analysis; documentation
# exclusions below do not remove Python modules from the analyzed source scope.
# The crap command's CLI defaults override its configured scoring thresholds.
# Regression, absolute CRAPload, and contract-coverage gates run separately.

classification:
  thresholds:
    # Effect-classification confidence [0-100], independent of test pairing
    # confidence and the minimum contract-coverage percentage gate.
    contractual: 75
    # Maximum confidence score (exclusive) for "incidental" label.
    incidental: 50

  doc_scan:
    exclude:
      # Defaults
      - "vendor/**"
      - "node_modules/**"
      - ".git/**"
      - "testdata/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      # Project-specific: exclude virtualenv, OpenCode node deps, cache dirs
      - ".venv/**"
      - ".opencode/node_modules/**"
      - ".agentready/**"
      - "reports/**"
      - ".pytest_cache/**"
      - "build/**"

scoring:
  # Report scoring policy. The crap CLI supplies its own threshold defaults.
  crap_threshold: 15.0

  # GazeCRAP classification is distinct from the contract-coverage gate.
  gaze_crap_threshold: 15.0
